<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="description" content="Lightweight calendar app for keeping track of monthly bill payments">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="lavender">
        <title>Bill Calendar</title>
        <link rel="icon" type="image/x-icon" href="favicon.ico">
        <link rel="apple-touch-icon" href="favicon_512.png">
        <!-- <link rel="manifest" href="manifest.json"> -->
        <script>
            // if ('serviceWorker' in navigator) {
            //     // FIXME: Something wrong with the serviceWorker? It's impossible to
            //     // get the stylesheet to update even after clearing the cache.
            //     // Could be a browser glitch too (I'm on FF nightly iirc),
            //     // should check on Chrome. Cache disabled for now.
            //     navigator.serviceWorker.register('service-worker.js', { type: 'module' });
            // }
        </script>
        <style>
            /* TODO: High contrast option (test with all color vision simulations)*/
            :root {
                --bg-primary-color: lavender;
                --bg-secondary-color: aliceblue;
                --header-color: lemonchiffon;
                --highlight-color: khaki;
                --red-ink-color: crimson;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --bg-primary-color: indigo;
                    --bg-secondary-color: darkslateblue;
                    --header-color: darkblue;
                    --highlight-color: midnightblue;
                    --red-ink-color: tomato;
                    background-color: black;
                    color: white;
                }
            }

            .past-due {
                color: var(--red-ink-color);
            }

            #nav-group {
                display: flex;
                align-items: center;
            }

            /* I'd like to do something like (min-width: var(--transition-width))
            /* But it seems you can't use variables in media selectors (yet) */
            /* Maybe soon though? https://drafts.csswg.org/css-env-1/ */
            @media screen and (min-width: 600px) {
                #month-label {
                    font-size: 24px;
                    font-weight:bold;
                }

                #nav-group {
                    height: 48px;
                    margin-bottom: 16px;
                }

                #date-nav {
                    margin-left: 24px;
                }
            }

            @media screen and (max-width: 600px) {
                body {
                    margin: 0;
                }

                #calendar {
                    /* So that the date nav at the top doesn't obscure the first day */
                    margin-top: 48px;
                    /* So that the table at the bottom doesn't obscure the last day */
                    margin-bottom: 96px;
                }

                #nav-group {
                    position: fixed;
                    top: 0;
                    left: 0;
                    height: 48px;
                    width: 100vw;
                    z-index: 1;
                    background-color: var(--header-color);
                }
                #date-nav {
                    flex-grow: 1;
                    padding-left: 16px;
                    padding-right: 16px;
                    box-sizing: border-box;
                    border: none;
                    outline: none;
                    background-color: inherit;
                    color: inherit;
                }
                #month-label {
                    margin-left: 16px;
                }
                #totals {
                    position: fixed;
                    bottom: 0;
                    left: 0;
                    background-color: var(--header-color);
                    border-right: 3px solid black;
                    border-top: 3px solid black;
                    height: 96px;
                }
                td {
                    padding: 2px 8px;
                }
            }
        </style>
        <!-- It looks like modulepreload is standard now but still not supported in Firefox and Safari? -->
        <!-- Looks like it was recently merged into WebKit so maybe Safari support soon, no news on FF...-->
        <link rel="modulepreload" href="templated-element.js">
        <link rel="modulePreload" href="singleton-element.js">
        <link rel="modulepreload" href="bills.js">
        <script type="module" src="calendar-day.js"></script>
        <script type="module" src="bill-calendar.js"></script>
        <script type="module" src="ui-main.js"></script>
        <script type="module" src="add-bill-dialog.js"></script>
        <script type="module" src="bill-list-dialog.js"></script>
    </head>
    <body>
        <!-- Importing HTML templates from HTML documents probably won't
             be a thing for a long time. It was a feature in Chrome for
             a while, but that was removed. The web components people
             have proposed an alternative, but it's moving along at a
             glacial pace.

             Anyways, I'm gonna put my templates here for now to keep
             things simple.
        -->
        <template id="calendar-day">
            <style>
                :host {
                    position: relative;
                    height: 100%;
                    background-color: inherit;
                }
                
                #bill-list-container {
                    overflow-y: auto;
                    height: 64px;
                    margin-bottom: 16px;
                }

                #add-bill-button {
                    position: absolute;
                    bottom: 0;
                    right: 0;
                    border: none;
                    outline: inherit;
                    background-color: crimson;
                    color: white;
                    font-weight: bold;
                    padding: 8px 16px;
                    cursor: pointer;
                }
                #add-bill-button:active {
                    filter: brightness(80%);
                }
                #add-bill-button:not(:active):focus {
                    border: 2px dashed black;
                }
                #day-of-month {
                    padding: 6px;
                    background-color: var(--bg-secondary-color);
                    width: fit-content;
                }
                @media screen and (max-width: 600px) {
                    :host {
                        display: flex;
                        flex-direction: column;
                    }
                    #bill-list-container {
                        height: 80px;
                        margin-bottom: 0;
                    }
                    #add-bill-button {
                        position: initial;
                        right: initial;
                        bottom: initial;
                    }
                    #add-bill-button:not(:active):focus {
                        border: none;
                    }
                }
            </style>
            <div id="day-of-month"></div>
            <div id="bill-list-container">
                <ul id="bill-list">
                </ul>
            </div>
            <button id="add-bill-button">Add Bill</button>
        </template>

        <template id="day-bill">
            <span id="name"></span>
            <span id="amount"></span>
        </template>

        <add-bill-dialog id="add-bill-dialog">
            <template>
                <style>
                    #dialog {
                        color: inherit;
                        background-color: var(--bg-secondary-color);
                        box-sizing: border-box;
                        padding: 0px 12px 16px 12px;
                    }
                    #bill-form {
                        margin: 0;
                        line-height: 32px;
                    }
                    input, select {
                        max-width: 128px;
                        float: right;
                    }
                    label {
                        display: block;
                    }
                    button {
                        float: right;
                    }
                    @media screen and (max-width: 600px) {
                        button {
                            font-size: 18px;
                        }
                    }
                </style>
                <dialog id="dialog">
                    <h3 id="date"></h3>
                    <form id="bill-form" method="dialog">
                        <label>Name <input type="text" id="name" required></label>
                        <label>Amount <input type="number" min="0" id="amount" required></label>
                        <label>Type <select id="type">
                            <option value="non-recurring" selected>Non-Recurring</option>
                            <option value="monthly">Monthly</option>
                        </select></label>
                        <label>Temporary? <input type="checkbox" id="temporary"></label>
                        <label>End Date: <input type="date" id="end-date" disabled required></label>
                        <button id="cancel-button" value="cancel" formnovalidate>Cancel</button>
                        <button id="add-button" value="submit">Add</button>
                    </form>
                </dialog>
            </template>
        </add-bill-dialog>

        <template id="bill-options-row-template">
            <style>
                label {
                    float: right;
                }
            </style>
            <span id="name"></span>
            <label>Paid: <input type="checkbox" id="paid"></label>
        </template>

        <bill-list-dialog id="bill-list-dialog">
            <template>
                <style>
                    #dialog {
                        color: inherit;
                        background-color: var(--bg-secondary-color);
                        box-sizing: border-box;
                        padding: 0px 12px 16px 12px;
                    }
                    #list {
                        display: flex;
                        flex-direction: column;
                        line-height: 32px;
                    }
                    button {
                        float: right;
                    }
    
                    @media screen and (max-width: 600px) {
                        button {
                            font-size: 18px;
                        }
                    }
                </style>
                <dialog id="dialog">
                    <h3 id="date"></h3>
                    <div id="list"></div>
                    <button id="done">Done</button>
                </dialog>
            </template>
        </bill-list-dialog>
        <div id="nav-group">
            <label id="month-label" for="date-nav">Month</label>
            <input type="date" id="date-nav">
        </div>
        <bill-calendar id="calendar">
            <template>
                <style>
                    :host {
                        display: block;
                    }
                    .current-day {
                        background-color: var(--highlight-color);
                    }
                    
                    padding-day {
                        opacity: 0;
                    }

                    :host([start-day="Sunday"]) > padding-day {
                        display: none;
                    }
                    :host([start-day="Monday"]) > padding-day:nth-of-type(n+2) {
                        display: none;
                    }
                    :host([start-day="Tuesday"]) > padding-day:nth-of-type(n+3) {
                        display: none;
                    }
                    :host([start-day="Wednesday"]) > padding-day:nth-of-type(n+4) {
                        display: none;
                    }
                    :host([start-day="Thursday"]) > padding-day:nth-of-type(n+5) {
                        display: none;
                    }
                    :host([start-day="Friday"]) > padding-day:nth-of-type(n+6) {
                        display: none;
                    }
                    /* No need for Saturday since all padding cells should be visible */
                    
                    :host([days-in-month="28"]) > calendar-day:nth-of-type(n+29) {
                        display: none;
                    }
                    :host([days-in-month="29"]) > calendar-day:nth-of-type(n+30) {
                        display: none;
                    }
                    :host([days-in-month="30"]) > calendar-day:nth-of-type(n+31) {
                        display: none;
                    }

                    padding-day, calendar-day {
                        background-color: var(--bg-primary-color);
                    }

                    @media screen and (min-width: 600px) {
                        :host {
                            display: grid;
                            grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr 1fr;
                            column-gap: 3px;
                            row-gap: 3px;
                        }

                        
                        .day-of-week-header {
                            text-align: center;
                            padding-top: 4px;
                            padding-bottom: 4px;
                            background-color: var(--header-color);
                        }
                    }

                    @media screen and (max-width: 600px) {
                        .day-of-week-header {
                            display: none;
                        }
                        padding-day {
                            display: none;
                        }
                    }
                </style>
                <!-- TODO: figure out a way to do i18n on these -->
                <!-- Will probably have to default to English and then have some JS update it once the page loads -->
                <div class="day-of-week-header">Sunday</div>
                <div class="day-of-week-header">Monday</div>
                <div class="day-of-week-header">Tuesday</div>
                <div class="day-of-week-header">Wednesday</div>
                <div class="day-of-week-header">Thursday</div>
                <div class="day-of-week-header">Friday</div>
                <div class="day-of-week-header">Saturday</div>
                <padding-day></padding-day>
                <padding-day></padding-day>
                <padding-day></padding-day>
                <padding-day></padding-day>
                <padding-day></padding-day>
                <padding-day></padding-day>
                <calendar-day day-of-month="1"></calendar-day>
                <calendar-day day-of-month="2"></calendar-day>
                <calendar-day day-of-month="3"></calendar-day>
                <calendar-day day-of-month="4"></calendar-day>
                <calendar-day day-of-month="5"></calendar-day>
                <calendar-day day-of-month="6"></calendar-day>
                <calendar-day day-of-month="7"></calendar-day>
                <calendar-day day-of-month="8"></calendar-day>
                <calendar-day day-of-month="9"></calendar-day>
                <calendar-day day-of-month="10"></calendar-day>
                <calendar-day day-of-month="11"></calendar-day>
                <calendar-day day-of-month="12"></calendar-day>
                <calendar-day day-of-month="13"></calendar-day>
                <calendar-day day-of-month="14"></calendar-day>
                <calendar-day day-of-month="15"></calendar-day>
                <calendar-day day-of-month="16"></calendar-day>
                <calendar-day day-of-month="17"></calendar-day>
                <calendar-day day-of-month="18"></calendar-day>
                <calendar-day day-of-month="19"></calendar-day>
                <calendar-day day-of-month="20"></calendar-day>
                <calendar-day day-of-month="21"></calendar-day>
                <calendar-day day-of-month="22"></calendar-day>
                <calendar-day day-of-month="23"></calendar-day>
                <calendar-day day-of-month="24"></calendar-day>
                <calendar-day day-of-month="25"></calendar-day>
                <calendar-day day-of-month="26"></calendar-day>
                <calendar-day day-of-month="27"></calendar-day>
                <calendar-day day-of-month="28"></calendar-day>
                <calendar-day day-of-month="29"></calendar-day>
                <calendar-day day-of-month="30"></calendar-day>
                <calendar-day day-of-month="31"></calendar-day>
            </template>
        </bill-calendar>
        <table id="totals">
            <tr>
                <td>Total Due: </td>
                <td id="total-due">$1000</td>
            </tr>
            <tr>
                <td>Total Past Due:</td>
                <!-- Set the past-due class when amount is non-zero-->
                <td id="total-past-due" class="past-due">$8</td>
            </tr>
            <tr>
                <td>Total Paid:</td>
                <td id="total-paid">$1000</td>
            </tr>
        </table>
    </body>
</html>
